     <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الزراعة الذكية</title>
      <link rel="shortcut icon" href="الزراعة الذكية.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root { --accent: #cddc39; --glass: rgba(255, 255, 255, 0.12); }
        body {
            margin: 0; font-family: 'Cairo', sans-serif; color: #fff;
            background: #0a2e0c linear-gradient(135deg, #0a2e0c 0%, #1b5e20 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header { 
            width: 100%; padding: 40px 20px; text-align: center; 
            background: rgba(0,0,0,0.4); backdrop-filter: blur(10px); 
            border-bottom: 1px solid rgba(255,255,255,0.1); 
        }
        .hero-section { text-align: center; padding: 50px 20px; }
        .hero-section h1 { font-size: 35px; color: var(--accent); margin-bottom: 10px; }
        .hero-section p { font-size: 18px; color: #e0e0e0; max-width: 600px; margin: auto; }

        .container { 
            max-width: 800px; width: 90%; display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
            gap: 20px; margin-bottom: 50px;
        }
        
        .card {
            background: var(--glass); backdrop-filter: blur(20px); border-radius: 25px;
            padding: 30px; text-align: center; border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card:hover { transform: translateY(-10px); border-color: var(--accent); }
        .card i { font-size: 50px; color: var(--accent); margin-bottom: 20px; }
        .card h2 { margin: 0 0 15px 0; font-size: 22px; }
        .card p { font-size: 15px; color: #ccc; margin-bottom: 25px; flex-grow: 1; }

        .btn-link {
            display: block; text-align: center; text-decoration: none;
            padding: 15px; border-radius: 12px;
            background: var(--accent); color: #1b5e20; 
            font-weight: 900; font-size: 16px;
            transition: 0.3s;
        }
        .btn-link:hover { background: #fff; transform: scale(1.05); }

        footer { margin-top: auto; padding: 20px; font-size: 14px; color: rgba(255,255,255,0.5); }
    </style>
</head>
<body>

<header>
    <h1><i class="fa-solid fa-microchip"></i> بوابة الزراعة الذكية</h1>
    <p>نحو مستقبل زراعي متطور في الوادي الجديد</p>
</header>



<div class="container">
    <div class="card">
        <i class="fa-solid fa-calendar-check"></i>
        <h2>مواعيد الزراعة</h2>
        <p>استعلم عن المواعيد المثالية للزراعة والحصاد بالتقويم القبطي والميلادي لكل محاصيل الوادي.</p>
        <a href="Valley Farming by the Coptic Calendar.html" class="btn-link">دخول المواعيد</a>
    </div>

    <div class="card">
        <i class="fa-solid fa-users-gear"></i>
        <h2>فريق الزراعة الذكية</h2>
        <p>تعرف على فريق العمل القائم على تطوير الحلول الذكية لدعم المزارعين في منطقتنا.</p>
        <a href="Smart_Farming_Team.html" class="btn-link">الفريق</a>
    </div>
</div>



</body>
</html>
